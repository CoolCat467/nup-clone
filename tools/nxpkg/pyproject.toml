[project]
name = "nxpkg"
version = "0.1.0"
description = "Reference implementation of the NXP (NX Package) container format for NX/Switch game dumps"
requires-python = ">=3.10"
dependencies = ["zstandard>=0.22"]

[project.scripts]
nxpkg = "nxpkg.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["nxpkg*"]
